<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | NISHLAB LMS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-box">
  <h1 class="center">Login</h1>
  <div id="errorBox" class="hidden" style="background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;margin-bottom:14px;font-size:13px;"></div>
  <label>Email</label>
  <input type="email" id="email" placeholder="you@example.com">
  <label>Password</label>
  <input type="password" id="password" placeholder="••••••••">
  <button class="btn" style="width:100%;" onclick="doLogin()">Login</button>
  <p class="center muted" style="margin-top:16px;">New here? <a href="signup.html" style="color:var(--gold);font-weight:600;">Create an account</a></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
function showError(msg) {
  const box = document.getElementById("errorBox");
  box.textContent = msg;
  box.classList.remove("hidden");
}
async function doLogin() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) return showError("Email aur password dono bharo.");
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const doc = await db.collection("users").doc(cred.user.uid).get();
    if (!doc.exists) return showError("User profile nahi mila. Admin se contact karo.");
    redirectToDashboard(doc.data().role);
  } catch (e) {
    showError(e.message);
  }
}
</script>
</body>
</html>
