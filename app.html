<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NISHLAB LMS</title>
<meta name="theme-color" content="#0e1114">
<link rel="icon" type="image/png" href="favicon.png">
