<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NISHLAB LMS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-box center">
  <h1>NISHLAB LMS</h1>
  <p class="muted">Learning Management System</p>
  <div id="loading"><div class="spinner"></div></div>
  <div id="actions" class="hidden">
    <a href="login.html" class="btn" style="width:100%;margin-bottom:10px;">Login</a>
    <a href="signup.html" class="btn btn-outline" style="width:100%;">Sign Up</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
auth.onAuthStateChanged(async (user) => {
  if (user) {
    const doc = await db.collection("users").doc(user.uid).get();
    if (doc.exists) { redirectToDashboard(doc.data().role); return; }
  }
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("actions").classList.remove("hidden");
});
</script>
</body>
</html>
