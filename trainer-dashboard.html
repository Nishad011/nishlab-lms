<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainer Dashboard | NISHLAB LMS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="navbar">
  <div class="brand">NISHLAB LMS — Trainer</div>
  <div>
    <span id="userName" style="color:var(--gold);font-weight:600;"></span>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</div>

<div class="container">
  <div id="pendingNotice" class="card hidden" style="border-left:4px solid #f59e0b;">
    <strong>⏳ Approval Pending</strong>
    <p class="muted">Aapka trainer account admin approval ka wait kar raha hai. Approve hone ke baad courses bana paoge.</p>
  </div>

  <div id="mainArea" class="hidden">
    <div class="card">
      <h2>Create New Course</h2>
      <label>Course Title</label>
      <input type="text" id="cTitle" placeholder="e.g. SolidWorks Professional">
      <label>Description</label>
      <textarea id="cDesc" rows="3" placeholder="Short description"></textarea>
      <button class="btn" onclick="createCourse()">Create Course</button>
    </div>

    <h2>My Courses</h2>
    <div id="coursesGrid" class="grid"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
let currentUser = null;

requireRole(["trainer"], (user, data) => {
  currentUser = user;
  document.getElementById("userName").textContent = data.name;
  if (!data.isApproved) {
    document.getElementById("pendingNotice").classList.remove("hidden");
  } else {
    document.getElementById("mainArea").classList.remove("hidden");
    loadCourses();
  }
});

async function createCourse() {
  const title = document.getElementById("cTitle").value.trim();
  const description = document.getElementById("cDesc").value.trim();
  if (!title) return alert("Course title bharo.");
  await db.collection("courses").add({
    title, description,
    trainerId: currentUser.uid,
    published: false,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  document.getElementById("cTitle").value = "";
  document.getElementById("cDesc").value = "";
  loadCourses();
}

async function loadCourses() {
  const grid = document.getElementById("coursesGrid");
  const snap = await db.collection("courses").where("trainerId", "==", currentUser.uid).get();
  if (snap.empty) {
    grid.innerHTML = '<p class="muted">Abhi koi course nahi banaya.</p>';
    return;
  }
  grid.innerHTML = "";
  snap.forEach(doc => {
    const c = doc.data();
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h3>${c.title}</h3>
      <p class="muted">${c.description || ""}</p>
      <span class="tag ${c.published ? 'tag-published' : 'tag-pending'}">${c.published ? 'Published' : 'Draft'}</span>
      <br><br>
      <a href="course-manage.html?id=${doc.id}" class="btn btn-sm">Manage</a>
    `;
    grid.appendChild(card);
  });
}
</script>
</body>
</html>
