<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NISHLAB LMS</title>
<meta name="theme-color" content="#1d1e42">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=21">
</head>
<body>
<div class="frame">
  <aside class="side-wrap">
    <a class="brand" href="#/"><img src="logo.png" alt="" width="20" height="30"><span><b>NISHLAB</b> LMS</span></a>
    <nav class="side" id="side" aria-label="Main"></nav>
    <div class="side-card" id="sideCard" hidden></div>
  </aside>
  <main class="main" id="view"><div class="spinner"></div></main>
  <aside class="rail" aria-label="Your day">
    <div class="rail-top" id="who" hidden>
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div class="who-text"><span class="name" id="userName"></span><span class="role" id="roleChip"></span></div>
      <a class="bell" id="bell" href="#/" aria-label="Tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></a>
    </div>
    <div id="railBody"></div>
    <div class="rail-foot"><button class="btn line" id="signOut" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>Log out</button></div>
  </aside>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="syllabus.js"></script>
<script src="app.js?v=22"></script>
</body>
</html>
